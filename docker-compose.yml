services:
  db:
    image: postgres:15
    container_name: library_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library_network

  redis:
    image: redis:latest
    container_name: book-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - library_network

  app:
    build: .
    container_name: library_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@db:5432/library"
      REDIS_URL: "redis://redis:6379/0"
      # Вимикаємо Rate Limiter для тестів, як у одногрупника
      RATE_LIMITER_ENABLED: "False" 
    depends_on:
      - db
      - redis
    volumes:
      - .:/code
    networks:
      - library_network

  # Додаємо сервіс Locust для Лаби №10
  locust:
    image: locustio/locust
    container_name: library_locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    # Вказуємо хост вашого API всередині мережі Docker
    command: -f /mnt/locust/locustfile.py --host=http://app:8000
    depends_on:
      - app
    networks:
      - library_network


networks:
  library_network:
    driver: bridge

volumes:
  postgres_data: